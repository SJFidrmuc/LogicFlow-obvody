[package]
name = "kontrola"
description = "Kontrola a katalog knihovny obvodů LogicFlow"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# Simulační jádro LogicFlow – stejné, jaké používá program.
logicflow-core = { git = "https://github.com/SJFidrmuc/LogicFlow", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
